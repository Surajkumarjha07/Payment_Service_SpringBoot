spring.application.name=paymentservice
server.port=${PAYMENT_SERVICE_PORT:4005}

# spring.datasource.url=jdbc:mysql://localhost:3306/payments
spring.datasource.url=jdbc:postgresql://${PAYMENT_DATABASE_HOST}:${PAYMENT_DATABASE_PORT:5432}/${PAYMENT_DATABASE_NAME}?sslmode=require&channel_binding=require
spring.datasource.username=${PAYMENT_DATABASE_USERNAME}
spring.datasource.password=${PAYMENT_DATABASE_PASSWORD}

# to migrate db when necessary
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#RAZORPAY SECRETS
razorpay.key.RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
razorpay.key.RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
razorpay.key.RAZORPAY_MERCHANT_ID=${RAZORPAY_MERCHANT_ID}

# KAFKA DEPENDENCY
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
